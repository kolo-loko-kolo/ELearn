<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Inner Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="360" cy="140" r="90" fill="#38BDF8" opacity="0.2" filter="url(#glow)" />
  <circle cx="150" cy="360" r="110" fill="#A855F7" opacity="0.18" filter="url(#glow)" />

  <!-- Main Symbol: Iconic 'E' + Book & Speech Cadence -->
  <g filter="url(#cardShadow)">
    <!-- Vertical Book Spine / Pillar of 'E' -->
    <rect x="120" y="128" width="56" height="256" rx="28" fill="#FFFFFF" />

    <!-- Top Shelf (Book Cover / 'E' Top arm) -->
    <path d="M148 128 h172 c15.464 0 28 12.536 28 28 v0 c0 15.464 -12.536 28 -28 28 h-172 c-15.464 0 -28 -12.536 -28 -28 v0 c0 -15.464 12.536 -28 28 -28 z" fill="#FFFFFF" />

    <!-- Middle Shelf (Speech / Turning Page) -->
    <path d="M148 228 h136 c15.464 0 28 12.536 28 28 v0 c0 15.464 -12.536 28 -28 28 h-136 c-15.464 0 -28 -12.536 -28 -28 v0 c0 -15.464 12.536 -28 28 -28 z" fill="#FFFFFF" fill-opacity="0.92" />

    <!-- Bottom Shelf ('E' Base) -->
    <path d="M148 328 h184 c15.464 0 28 12.536 28 28 v0 c0 15.464 -12.536 28 -28 28 h-184 c-15.464 0 -28 -12.536 -28 -28 v0 c0 -15.464 12.536 -28 28 -28 z" fill="#FFFFFF" />

    <!-- Soundwave & Intuition Accent: 3 Dynamic Speech Bars -->
    <rect x="368" y="210" width="22" height="92" rx="11" fill="url(#sparkGrad)" />
    <rect x="404" y="232" width="22" height="48" rx="11" fill="url(#sparkGrad)" opacity="0.8" />
  </g>

  <!-- Spark of Epiphany / Fluency Star -->
  <g transform="translate(372, 124)">
    <circle cx="0" cy="0" r="16" fill="#38BDF8" filter="url(#glow)" />
    <!-- 4-point star -->
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FFFFFF" />
  </g>
</svg>
